name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "packages/db-schema/**"
      - "packages/shared-types/**"
      - "scripts/validate-migrations.py"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "packages/db-schema/**"
      - "packages/shared-types/**"
      - "scripts/validate-migrations.py"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hendy-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Worker, tests and D1 migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace
        run: pnpm install --no-frozen-lockfile

      - name: Check Worker JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find backend/src -type f -name '*.js' -print0)

      - name: Run unit and integration tests
        run: pnpm test

      - name: Validate all D1 migrations in SQLite
        run: python3 scripts/validate-migrations.py

  deploy:
    name: Apply D1 migrations and deploy Worker
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace
        run: pnpm install --no-frozen-lockfile

      - name: Validate Cloudflare deployment settings
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
          CF_KV_NAMESPACE_ID: ${{ vars.CF_KV_NAMESPACE_ID }}
          PUBLIC_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN" || { echo "::error::Missing GitHub Actions secret CF_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing GitHub Actions secret CF_ACCOUNT_ID"; exit 1; }
          test -n "$CF_D1_DATABASE_ID" || { echo "::error::Missing Actions variable CF_D1_DATABASE_ID"; exit 1; }
          test -n "$CF_KV_NAMESPACE_ID" || { echo "::error::Missing Actions variable CF_KV_NAMESPACE_ID"; exit 1; }
          [[ "$PUBLIC_API_BASE_URL" == https://* ]] || { echo "::error::Set VITE_API_BASE_URL to the HTTPS Worker URL"; exit 1; }
          python3 - <<'PY'
          import os, re
          for name in ("CF_ACCOUNT_ID", "CF_D1_DATABASE_ID", "CF_KV_NAMESPACE_ID"):
              value = os.environ[name].strip()
              if not re.fullmatch(r"[A-Fa-f0-9-]{32,36}", value):
                  raise SystemExit(f"::error::Invalid {name}; expected a Cloudflare ID")
          PY

      - name: Prepare Worker bindings
        env:
          CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
          CF_KV_NAMESPACE_ID: ${{ vars.CF_KV_NAMESPACE_ID }}
          PUBLIC_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path("backend/wrangler.toml")
          text = path.read_text()
          replacements = {
              "REPLACE_WITH_D1_DATABASE_ID": os.environ["CF_D1_DATABASE_ID"].strip(),
              "REPLACE_WITH_KV_NAMESPACE_ID": os.environ["CF_KV_NAMESPACE_ID"].strip(),
              "REPLACE_WITH_PUBLIC_API_BASE_URL": os.environ["PUBLIC_API_BASE_URL"].strip().rstrip("/"),
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Missing expected Wrangler placeholder: {old}")
              text = text.replace(old, new)
          if "REPLACE_WITH_" in text:
              raise SystemExit("A Wrangler placeholder remains unresolved")
          path.write_text(text)
          PY

      - name: Verify Cloudflare access and configured Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler whoami
          pnpm exec wrangler secret list --config backend/wrangler.toml > /tmp/hendy-worker-secrets.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          items = json.loads(Path("/tmp/hendy-worker-secrets.json").read_text())
          names = {item.get("name") for item in items}
          required = {"BOT_TOKEN", "WEBHOOK_SECRET_TOKEN", "WEBHOOK_SETUP_KEY", "ADMIN_API_TOKEN"}
          missing = sorted(required - names)
          if missing:
              raise SystemExit("::error::Configure these Worker secrets in Cloudflare before deployment: " + ", ".join(missing))
          print("Required Worker secrets are present (values were not displayed).")
          PY

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply DB --remote --config backend/wrangler.toml

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config backend/wrangler.toml

      - name: Smoke test Worker HTTPS endpoint
        env:
          PUBLIC_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "${PUBLIC_API_BASE_URL%/}/healthz"
